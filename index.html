<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>36th G1 — Fan Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="winner-banner" id="winnerBanner">
    <div class="winner-confetti" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="winner-banner-inner">
      <button class="winner-dismiss" id="winnerDismiss" aria-label="Close">&times;</button>
      <svg class="winner-trophy" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="trophyGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF3B0"/>
            <stop offset="50%" stop-color="#E8FF29"/>
            <stop offset="100%" stop-color="#C9A227"/>
          </linearGradient>
        </defs>
        <path d="M25 30 C5 30 5 60 25 62" stroke="url(#trophyGold)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M95 30 C115 30 115 60 95 62" stroke="url(#trophyGold)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M25 20 H95 V45 C95 70 78 85 60 85 C42 85 25 70 25 45 Z" fill="url(#trophyGold)"/>
        <rect x="53" y="85" width="14" height="20" fill="url(#trophyGold)"/>
        <rect x="35" y="105" width="50" height="10" rx="2" fill="url(#trophyGold)"/>
        <rect x="25" y="115" width="70" height="12" rx="3" fill="url(#trophyGold)"/>
      </svg>
      <div class="winner-photo-wrap">
        <img src="images/Oiwa.png" alt="Ryohei Oiwa" onerror="this.parentElement.style.display='none'">
      </div>
      <p class="winner-eyebrow">G1 CLIMAX 36 CHAMPION</p>
      <h2 class="winner-name">Ryohei Oiwa</h2>
    </div>
  </div>
  <div class="brand-stripe"></div>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="event-mark" href="/" aria-label="G1 Climax 36 — home">
        <img class="event-logo" src="g1-36-logo.png" alt="G1 Climax 36">
      </a>
      <div class="masthead-text">
        <p class="eyebrow">NEW JAPAN PRO-WRESTLING &middot; UNOFFICIAL FAN TRACKER</p>
        <h1>GRADE ONE CLIMAX 36<span class="dot">.</span></h1>
        <p class="masthead-sub">blocks &middot; cards &middot; your match stars</p>
      </div>
      <div class="masthead-meta">
        <div class="meta-row"><span>WINNER EARNS</span><strong>IWGP World Title shot</strong></div>
        <div class="meta-row"><span>FINALS</span><strong>Aug 16 — Ryōgoku</strong></div>
        <div class="meta-row"><span>NEXT CARD</span><strong id="nextCardLabel">—</strong></div>
        <div class="meta-row"><span>KICKOFF IN</span><strong id="nextCardCountdown">—</strong></div>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="nights">CARDS</button>
    <button class="tab" data-view="standings">STANDINGS</button>
    <button class="tab" data-view="stars">TOP RATED</button>
  </nav>
  <main>
    <section id="view-nights" class="view active">
      <div class="night-picker" id="nightPicker"></div>
      <div class="card-grid" id="cardGrid"></div>
    </section>
    <section id="view-standings" class="view">
      <div class="standings-wrap">
        <div class="block-table" id="blockA">
          <h2 class="block-title block-a">BLOCK A</h2>
          <table><thead><tr>
            <th class="col-name">Wrestler</th><th>W</th><th>L</th><th>D</th><th>PTS</th>
          </tr></thead><tbody></tbody></table>
        </div>
        <div class="block-table" id="blockB">
